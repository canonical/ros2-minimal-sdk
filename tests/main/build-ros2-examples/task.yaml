summary: Build and test the ROS 2 examples with colcon

environment:
  PROJECT: /home/ubuntu/ros2-examples

prepare: |
  # Clone the ROS 2 examples into a dedicated directory
  # that will serve as the workshop project
  git clone https://github.com/ros2/examples -b ${ROS_DISTRO} ${PROJECT}
  envsubst '${BASE}' <workshop.yaml.in >${PROJECT}/workshop.yaml
  workshop -p ${PROJECT} launch

restore: |
  workshop -p ${PROJECT} remove || true
  rm -rf ${PROJECT}

execute: |
  workshop -p ${PROJECT} exec -- bash -lc 'colcon build'
  workshop -p ${PROJECT} exec -- bash -lc 'colcon test'
  workshop -p ${PROJECT} exec -- bash -lc 'colcon test-result --all'

debug: |
  workshop -p ${PROJECT} exec -- bash -lc 'colcon build --event-handlers console_direct+' || true
  workshop -p ${PROJECT} tasks
